<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1222" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4f1e8" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,400&display=swap"
    />
    <!--app-head-->
    <script>
      // Set the theme before first paint (no flash of the wrong theme).
      (() => {
        let theme = "dark";
        try {
          theme = localStorage.getItem("theme") ||
            (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
        } catch {}
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
